name: Refresh Google reviews

on:
  schedule:
    # Monday 07:15 UTC. Google's terms require a stored review to be refreshed
    # within 30 days; weekly is inside that and costs one Place Details call.
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch reviews
        if: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Skip until the API key exists
        if: ${{ secrets.GOOGLE_PLACES_API_KEY == '' }}
        run: echo "GOOGLE_PLACES_API_KEY is not set — leaving the checked-in reviews file as-is."

      - name: Commit if reviews changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/content/google-reviews.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Google reviews"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build static export
        if: steps.commit.outputs.changed == 'true'
        working-directory: site
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /truthcare

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
